# Lets Alloy list and inspect containers and read their logs through the Docker API, and nothing else.
# Only Alloy and this proxy are on the internal docker-api network.
# Inspect and logs are allowed for every container, since Alloy needs both, so container env stays readable through this proxy.

global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout http-request 10s
    # Log streams stay open; Alloy reconnects after a timeout.
    timeout client 10m
    timeout server 10m

frontend docker
    bind :2375
    http-request deny unless { method GET HEAD }
    # The calls Alloy makes: ping, version, list and inspect containers, stream their logs, list networks.
    http-request deny unless { path,url_dec -m reg ^(/v1\.[0-9]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs)|networks)$ }
    # Log refused requests; allowed ones stay below the warning level set above.
    http-after-response set-log-level warning if { status 403 }
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
