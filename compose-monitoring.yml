# Override any defaults specified by `${FOO:-bar}` in `.env` with `FOO=qux`.
# ${VARIABLE:-default} evaluates to default if VARIABLE is unset or empty in the environment.
# ${VARIABLE-default} evaluates to default only if VARIABLE is unset in the environment.

services:
  prometheus:
    profiles: [monitoring-metrics]
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.1}
    user: ":"
    networks: [dvnode, monitoring]
    # The token is a secret file, not an environment variable, so inspecting the container does not reveal it.
    secrets: [prom_remote_write_token]
    environment:
      SERVICE_OWNER: ${SERVICE_OWNER:-}
      ALERT_DISCORD_IDS: "${ALERT_DISCORD_IDS:-}"
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      CLUSTER_PEER: ${CLUSTER_PEER:-}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    entrypoint: /etc/prometheus/run.sh
    restart: unless-stopped

  grafana:
    profiles: [monitoring-visualization]
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.5}
    ports:
      - ${MONITORING_IP_GRAFANA:-127.0.0.1}:${MONITORING_PORT_GRAFANA:-3000}:3000
    networks: [monitoring]
    # security_opt and cap_drop are set in docker-compose.yml: Compose concatenates list fields across files.
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/datasource.yml:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/dashboards:/etc/dashboards:ro
      # A named volume lets Grafana run as its own non-root user. Nothing in it needs keeping: dashboards and datasources are provisioned.
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  loki:
    profiles: [monitoring-log-aggregator]
    image: grafana/loki:${LOKI_VERSION:-3.7.9}
    user: ":"
    networks: [dvnode, monitoring]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./data/loki:/loki
    restart: unless-stopped

  alloy:
    profiles: [monitoring-log-collector]
    image: grafana/alloy:${ALLOY_VERSION:-v1.21.3}
    environment:
      CHARON_LOKI_ADDRESSES: ${CHARON_LOKI_ADDRESSES:-}
      CLUSTER_NAME: ${CLUSTER_NAME:-}
      CLUSTER_PEER: ${CLUSTER_PEER:-}
    # Alloy only reads logs and sends them on, so it needs no capabilities and writes only its rendered config and its data.
    # The image's own alloy user, which owns the data directory; root without capabilities can't write to it.
    user: "473:473"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [dvnode, docker-api]
    depends_on: [docker-socket-proxy]
    entrypoint: /etc/alloy/run.sh
    command:
      [
        "/bin/alloy",
        "run",
        "/tmp/config.alloy",
        "--storage.path=/var/lib/alloy/data",
        "--disable-reporting",
      ]
    restart: unless-stopped

  # Gives Alloy only the Docker API calls it needs instead of the full Docker API (allowlist in docker-socket-proxy/haproxy.cfg).
  docker-socket-proxy:
    profiles: [monitoring-log-collector]
    image: haproxy:${HAPROXY_VERSION:-3.2.26-alpine}
    # Root inside the container only so it can open the root-owned Docker socket; it has no capabilities and a read-only filesystem.
    user: "0:0"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Restart if the Docker socket goes away, for example after a Docker engine update: the restart mounts the new socket.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || kill 1"]
      interval: 60s
      timeout: 10s
      start_period: 10s
    networks: [docker-api]
    restart: unless-stopped

networks:
  dvnode:
  # Grafana only joins this network, so it can reach the monitoring backends but not charon, the clients or the ejector.
  monitoring:
  # Only Alloy and the Docker socket proxy join this network, and it has no external access.
  docker-api:
    internal: true

secrets:
  prom_remote_write_token:
    environment: PROM_REMOTE_WRITE_TOKEN

volumes:
  alloy-data:
  grafana-data:
