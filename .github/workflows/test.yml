name: tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  create_containers:
    # Ensures default fresh checkout can create containers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: docker compose up --no-start

  check_exposure:
    # Ensures the defaults only expose P2P ports and keep anonymous Grafana access read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: 'pip install --only-binary :all: pyyaml==6.0.2'
      - run: python3 .github/scripts/check_exposure.py

  start_log_collector:
    # Ensures Alloy and the Docker socket proxy start and stay up with their hardening options.
    runs-on: ubuntu-latest
    env:
      CHARON_LOKI_ADDRESSES: http://loki:3100/loki/api/v1/push
      CLUSTER_NAME: ci
      CLUSTER_PEER: ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: docker compose -f compose-monitoring.yml --profile monitoring-log-collector up -d
      - run: |
          sleep 30
          docker compose -f compose-monitoring.yml --profile monitoring-log-collector ps -a
          for service in alloy docker-socket-proxy; do
            id=$(docker compose -f compose-monitoring.yml --profile monitoring-log-collector ps -a -q "$service")
            state=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$id")
            if [ "$state" != "running 0" ]; then
              echo "::error::$service is '$state', expected 'running 0'"
              docker logs "$id"
              exit 1
            fi
          done

  render_configs:
    # Ensures every sample .env and the debug overlay produce a valid merged compose config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: |
          for env in .env.sample.*; do
            echo "Rendering $env"
            cp "$env" .env
            docker compose --profile '*' config --quiet
          done
          rm .env
          docker compose -f docker-compose.yml -f compose-debug.yml config --quiet
